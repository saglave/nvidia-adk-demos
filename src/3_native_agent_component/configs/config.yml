general:
  front_end:
    _type: console
    cors:
      allow_origins: ["*"]
  telemetry:
    logging:
      console:
        _type: console
        level: debug
    tracing:
      phoenix_local:
        _type: phoenix
        endpoint: http://localhost:6006/v1/traces
        project: reco

functions:
  weather_update_tool:
    _type: nat_adk_single_wrap/weather_update_tool
    description: "Get the current weather for a specified city"
  get_city_time_tool:
    _type: nat_adk_single_wrap/get_city_time_tool
  

llms:
  llm:
    _type: openai
    model_name: openai/azure-openai/snps-openai-gpt-41

sub_workflow:  
  _type: adk
  name: adk_sub_agent
  tool_names: [get_city_time_tool]
  description: "Sub-agent to get the current time in a specific city"
  llm: llm
  workflow_alias: adk_sub_agent
  prompt: >
    You are a helpful sub-agent who can answer user questions about the time in a city.

workflow:
  _type: adk
  name: root_agent
  llm: llm
  tool_names: [weather_update_tool]
  sub_workflows: [adk_sub_agent]
  description: "To get the current weather and time in a specific city"
  prompt: >
    You are a helpful agent who can answer user questions about weather in a city.
    You also have a sub-agent that can answer questions about the time in a city.
